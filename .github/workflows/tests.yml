name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly (Mondays 13:17 UTC). The code rarely changes, but meshcore and
    # requests are unpinned, so this catches upstream releases that break things.
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install latest dependencies
        run: pip install --upgrade -r requirements.txt

      - name: Show installed meshcore version
        run: pip show meshcore | head -2

      - name: Run offline tests (fake NOAA and fake radio)
        env:
          REQUIRE_MESHCORE: "1"
        run: python -m unittest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tide-bot:ci .

      - name: Check the bot imports inside the image
        run: docker run --rm tide-bot:ci python -c "import tide_bot; print('ok')"
